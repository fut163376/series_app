name: Build APK

on:
  push:
    branches:
      - "claude/streaming-platform-multiplatform-a56twr"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/tv-navegador.apk
          ls -la dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-navegador-apk
          path: dist/tv-navegador.apk
          if-no-files-found: error
